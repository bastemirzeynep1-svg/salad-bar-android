name: Build Android Game
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Build Project Structure
      run: |
        mkdir -p app/src/main/java/com/exam/saladbar
        mkdir -p app/src/main/res/layout
        
        cat << 'EOF' > settings.gradle.kts
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "SaladBar"
        include(":app")
        EOF
        
        cat << 'EOF' > build.gradle.kts
        plugins { id("com.android.application") version "8.1.0" apply false }
        EOF
        
        cat << 'EOF' > app/build.gradle.kts
        plugins { id("com.android.application") }
        android {
            namespace = "com.exam.saladbar"
            compileSdk = 34
            defaultConfig { applicationId = "com.exam.saladbar"; minSdk = 26; targetSdk = 34; versionCode = 1; versionName = "1.0" }
        }
        EOF
        
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Salad Bar" android:theme="@android:style/Theme.Light.NoTitleBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:background="#E8F5E9" android:padding="20dp">
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🥗 The Fresh Bowl" android:textSize="32sp" android:textStyle="bold" android:textColor="#1B5E20"/>
            <TextView android:id="@+id/scoreText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Score: 0" android:textSize="24sp" android:textStyle="bold" android:textColor="#2E7D32" android:layout_marginTop="10dp"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Customer Order:" android:textSize="20sp" android:textStyle="bold" android:layout_marginTop="30dp" android:textColor="#E65100"/>
            <TextView android:id="@+id/orderText" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="🥬 🍅" android:textSize="40sp" android:layout_marginBottom="30dp"/>
            <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Your Bowl:" android:textSize="20sp" android:textStyle="bold" android:textColor="#424242"/>
            <TextView android:id="@+id/plateText" android:layout_width="match_parent" android:layout_height="80dp" android:text="" android:textSize="40sp" android:background="#FFFFFF" android:gravity="center" android:layout_marginBottom="20dp"/>
            <GridLayout android:layout_width="wrap_content" android:layout_height="wrap_content" android:columnCount="3" android:rowCount="2">
                <Button android:id="@+id/btn1" android:text="🥬" android:textSize="30sp" android:layout_margin="5dp"/>
                <Button android:id="@+id/btn2" android:text="🍅" android:textSize="30sp" android:layout_margin="5dp"/>
                <Button android:id="@+id/btn3" android:text="🥒" android:textSize="30sp" android:layout_margin="5dp"/>
                <Button android:id="@+id/btn4" android:text="🥕" android:textSize="30sp" android:layout_margin="5dp"/>
                <Button android:id="@+id/btn5" android:text="🧀" android:textSize="30sp" android:layout_margin="5dp"/>
                <Button android:id="@+id/btnServe" android:text="SERVE" android:textSize="18sp" android:textStyle="bold" android:backgroundTint="#4CAF50" android:textColor="#FFFFFF" android:layout_margin="5dp"/>
            </GridLayout>
            <Button android:id="@+id/btnClear" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="CLEAR BOWL" android:textStyle="bold" android:backgroundTint="#EF5350" android:textColor="#FFFFFF" android:layout_marginTop="20dp"/>
        </LinearLayout>
        EOF
        
        cat << 'EOF' > app/src/main/java/com/exam/saladbar/MainActivity.java
        package com.exam.saladbar;
        import android.app.Activity;
        import android.os.Bundle;
        import android.widget.TextView;
        import android.widget.Toast;
        import java.util.ArrayList;
        import java.util.Collections;
        import java.util.Random;
        public class MainActivity extends Activity {
            String[] ingredients = {"🥬", "🍅", "🥒", "🥕", "🧀"};
            ArrayList<String> currentOrder = new ArrayList<>();
            ArrayList<String> currentPlate = new ArrayList<>();
            int score = 0;
            TextView orderText, plateText, scoreText;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);
                orderText = findViewById(R.id.orderText);
                plateText = findViewById(R.id.plateText);
                scoreText = findViewById(R.id.scoreText);
                findViewById(R.id.btn1).setOnClickListener(v -> addIngredient("🥬"));
                findViewById(R.id.btn2).setOnClickListener(v -> addIngredient("🍅"));
                findViewById(R.id.btn3).setOnClickListener(v -> addIngredient("🥒"));
                findViewById(R.id.btn4).setOnClickListener(v -> addIngredient("🥕"));
                findViewById(R.id.btn5).setOnClickListener(v -> addIngredient("🧀"));
                findViewById(R.id.btnClear).setOnClickListener(v -> { currentPlate.clear(); updatePlateText(); });
                findViewById(R.id.btnServe).setOnClickListener(v -> {
                    ArrayList<String> sortedPlate = new ArrayList<>(currentPlate);
                    ArrayList<String> sortedOrder = new ArrayList<>(currentOrder);
                    Collections.sort(sortedPlate); Collections.sort(sortedOrder);
                    if (sortedPlate.equals(sortedOrder) && !sortedPlate.isEmpty()) {
                        score += 10; scoreText.setText("Score: " + score);
                        Toast.makeText(this, "Perfect!", Toast.LENGTH_SHORT).show();
                        generateOrder();
                    } else {
                        Toast.makeText(this, "Wrong order!", Toast.LENGTH_SHORT).show();
                        currentPlate.clear(); updatePlateText();
                    }
                });
                generateOrder();
            }
            private void addIngredient(String item) {
                if (currentPlate.size() < 6) { currentPlate.add(item); updatePlateText(); }
            }
            private void updatePlateText() { plateText.setText(String.join(" ", currentPlate)); }
            private void generateOrder() {
                currentPlate.clear(); updatePlateText(); currentOrder.clear();
                Random r = new Random(); int size = r.nextInt(3) + 2;
                for(int i = 0; i < size; i++) currentOrder.add(ingredients[r.nextInt(ingredients.length)]);
                orderText.setText(String.join(" ", currentOrder));
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
        
    - name: Build with Gradle
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SaladBar-Game-APK
        path: app/build/outputs/apk/debug/app-debug.apk
